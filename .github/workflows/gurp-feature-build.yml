name: gurp feature build
# Builds a preview for feature branches. Gurp is a fictional brand used for website research.
on:
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build preview
        run: |
          echo "building preview for ${{ github.ref_name }}"
          echo "deploy target: ${{ vars.GURP_LOG_NOTE }}"
          echo "::notice title=Preview ready::${{ vars.GURP_NOTICE_NOTE }}"
          echo "### Preview build" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ vars.GURP_SUMMARY_NOTE }}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          echo "${{ vars.GURP_ARTIFACT_BODY }}" > out/build-notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.GURP_ARTIFACT_NAME }}
          path: out/
